[project]
name = "stimulus-harvester"
version = "0.2.0rc4"
description = "Local-first pipeline for harvesting, filtering, scoring, and reviewing candidate stimulus images for research use."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "Pillow>=10.2,<11",
    "ImageHash>=4.3,<5",
    "jinja2>=3.1,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
gui-test = ["PySide6-Essentials>=6.8,<7", "pytest-qt>=4.4,<5"]
# Choose CPU or CUDA wheels explicitly before this extra; see docs/screening.md.
screening = ["torch==2.8.0", "torchvision==0.23.0"]
benchmark = ["torch==2.8.0", "torchvision==0.23.0", "psutil>=5.9,<8"]
# Heavy, GPU-relevant. Install a CUDA-matched torch wheel FIRST (matching your local
# driver/CUDA runtime), then install this extra. open_clip_torch declares a loose
# torch dependency, so if torch is not already satisfied, pip may pull a default
# (possibly CPU-only or mismatched-CUDA) wheel from PyPI instead of the one you want.
clip = [
    "torch>=2.1",
    "open_clip_torch>=2.24,<3",
]
# No extra needed for VLM adjudication: the Ollama backend only needs httpx (core).
# Ollama itself is an external local service you run separately, not a pip package.
dev = [
    "setuptools>=68",
    "wheel",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
]

[project.scripts]
stimulus-harvester = "stimulus_harvester.cli:main"

[project.gui-scripts]
stimulus-harvester-gui = "stimulus_harvester.gui.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stimulus_harvester = ["py.typed", "review/templates/*.html", "review/static/*.css", "review/static/*.js", "resources/*.yaml", "resources/*.ico", "resources/*.svg", "resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
